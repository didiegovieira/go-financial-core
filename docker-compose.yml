version: '3.8'

services:
  financial-core:
    build:
      context: .
      dockerfile: ./apps/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      alloy:
        condition: service_started
    ports:
      - "8080:8080"
    env_file: .env.example
    environment:
      - HTTP_SERVER_PORT=:8080
      - POSTGRES_DATABASE=financial_core_db
      - OTEL_SERVICE_NAME=financial-core-api
      - OTEL_RESOURCE_ATTRIBUTES=service.name=financial-core-api
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    networks:
      - financial-core-network

  audit:
    build:
      context: .
      dockerfile: ./apps/audit/Dockerfile
    depends_on:
      alloy:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: .env.example
    environment:
      - HTTP_SERVER_PORT=:8081
      - POSTGRES_DATABASE=audit_db
      - OTEL_SERVICE_NAME=audit-worker
      - OTEL_RESOURCE_ATTRIBUTES=service.name=audit-worker
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    networks:
      - financial-core-network

  notifications:
    build:
      context: .
      dockerfile: ./apps/notification/Dockerfile
    depends_on:
      alloy:
        condition: service_started
      kafka:
        condition: service_started
    env_file: .env.example
    environment:
      - HTTP_SERVER_PORT=:8083
      - POSTGRES_DATABASE=notification_db
      - OTEL_SERVICE_NAME=notification-worker
      - OTEL_RESOURCE_ATTRIBUTES=service.name=notification-worker
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    networks:
      - financial-core-network

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financial-core-network
    volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        - ./docker/postgres/seeds:/seeds:ro

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - financial-core-network

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    # The local MVP volume is initialized by Tempo itself.
    user: "0:0"
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" # readiness and trace API
    networks:
      - financial-core-network

  grafana:
    image: grafana/grafana:12.3.0
    depends_on:
      - tempo
      - loki
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
      - ./docker/observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/financial.yaml:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - financial-core-network

  loki:
    image: grafana/loki:3.6.0
    command: ["-config.file=/etc/loki/config.yaml"]
    user: "0:0"
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - financial-core-network

  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - financial-core-network

  alloy:
    image: grafana/alloy:v1.11.3
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-go-financial-core}
    depends_on:
      - tempo
      - loki
      - prometheus
    volumes:
      - ./docker/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    networks:
      - financial-core-network

volumes:
  postgres-data:
  kafka-data:
  tempo-data:
  grafana-data:
  loki-data:
  prometheus-data:
  alloy-data:

networks:
  financial-core-network:
    driver: bridge
