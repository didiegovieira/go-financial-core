version: '3.8'

services:
  financial-core:
    build:
      context: .
      dockerfile: ./apps/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "8080:8080"
    env_file: .env.example
    environment:
      - HTTP_SERVER_PORT=:8080
      - POSTGRES_DATABASE=financial_core_db
      - OTEL_SERVICE_NAME=financial-core-api
      - OTEL_RESOURCE_ATTRIBUTES=service.name=financial-core-api
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    networks:
      - financial-core-network

  audit:
    build:
      context: .
      dockerfile: ./apps/audit/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file: .env.example
    environment:
      - HTTP_SERVER_PORT=:8081
      - POSTGRES_DATABASE=audit_db
      - OTEL_SERVICE_NAME=audit-worker
      - OTEL_RESOURCE_ATTRIBUTES=service.name=audit-worker
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    networks:
      - financial-core-network

  notifications:
    build:
      context: .
      dockerfile: ./apps/notification/Dockerfile
    depends_on:
      kafka:
        condition: service_started
    env_file: .env.example
    environment:
      - HTTP_SERVER_PORT=:8083
      - POSTGRES_DATABASE=notification_db
      - OTEL_SERVICE_NAME=notification-worker
      - OTEL_RESOURCE_ATTRIBUTES=service.name=notification-worker
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    networks:
      - financial-core-network

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - financial-core-network
    volumes:
        - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - financial-core-network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - financial-core-network

networks:
  financial-core-network:
    driver: bridge
